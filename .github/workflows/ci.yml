name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.26.2
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:tasks
      - run: pnpm test:integration
      - run: pnpm test:unit
      - run: pnpm build

  rust-quality:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show
      - run: cargo fmt --all --check
      - run: cargo check --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  desktop-e2e:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.26.2
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Install BasicTeX 2026.0301
        run: |
          curl --fail --location --retry 3 https://ctan.math.illinois.edu/systems/mac/mactex/mactex-basictex-20260301.pkg --output "$RUNNER_TEMP/basictex.pkg"
          echo "19164fbfef08c30fd433f59203c8804abbbd685d3a344ef7f0ba8c1fd4157cb3  $RUNNER_TEMP/basictex.pkg" | shasum --algorithm 256 --check
          sudo installer -pkg "$RUNNER_TEMP/basictex.pkg" -target /
          sudo /Library/TeX/texbin/tlmgr option repository https://ctan.math.illinois.edu/systems/texlive/tlnet
          sudo /Library/TeX/texbin/tlmgr update --self
          sudo /Library/TeX/texbin/tlmgr install latexmk luatexja haranoaji regexpatch
          /Library/TeX/texbin/latexmk --version
          /Library/TeX/texbin/lualatex --version
      - name: Check test feature and build embedded WebDriver app
        run: |
          rustup show
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --features desktop-e2e --all-targets -- -D warnings
          pnpm build:e2e
      - name: Run native WebView with real TeX
        run: pnpm test:e2e
      - name: Verify body visitor with real TeX and PDF text extraction
        run: pnpm test:tex
      - name: Verify production excludes the test server
        run: |
          cargo tree --manifest-path src-tauri/Cargo.toml --locked --edges normal --prefix none > "$RUNNER_TEMP/production-dependencies.txt"
          if rg '^tauri-plugin-wdio' "$RUNNER_TEMP/production-dependencies.txt"; then exit 1; fi

  required-checks:
    if: always()
    needs: [frontend-quality, rust-quality, desktop-e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every quality job to succeed
        env:
          FRONTEND_RESULT: ${{ needs.frontend-quality.result }}
          RUST_RESULT: ${{ needs.rust-quality.result }}
          DESKTOP_RESULT: ${{ needs.desktop-e2e.result }}
        run: |
          test "$FRONTEND_RESULT" = success
          test "$RUST_RESULT" = success
          test "$DESKTOP_RESULT" = success
