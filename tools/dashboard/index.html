<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resume Studio 開発進捗</title>
<style>
body{font-family:system-ui,sans-serif;background:#f4f6fa;color:#182337;margin:0}main{max-width:1120px;margin:auto;padding:32px 20px}h1{font-size:26px}button,select,input{font:inherit;padding:9px;border:1px solid #acb8ca;border-radius:6px;background:white}button{cursor:pointer}#controls{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}#summary,#milestones{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.metric,article{background:white;border:1px solid #d9e0ea;border-radius:10px;padding:18px}.metric{flex:1;min-width:110px}.metric strong{display:block;font-size:25px}article{margin:12px 0}article h2{font-size:18px;margin:0 0 10px}.meta{color:#526176;font-size:14px}progress{width:100%;accent-color:#196dbe}#error{color:#a02020;white-space:pre-wrap}#source{color:#526176}details{margin-top:12px}label{display:flex;gap:6px;align-items:center}#milestones .metric strong{font-size:18px}a{color:#196dbe}
</style>
<main>
<h1>Resume Studio 開発進捗</h1>
<p>tasks/tasks.jsonl を参照する閲覧用ダッシュボード。進捗は台帳を編集して更新します。</p>
<p id="source" role="status">読み込み中…</p>
<button id="reload">台帳を再読み込み</button>
<label>JSONLファイルを選択 <input id="file" type="file" accept=".jsonl,application/json,text/plain"></label>
<p id="error" role="alert"></p>
<section id="summary" aria-label="全体進捗"></section>
<section id="milestones" aria-label="マイルストーン進捗"></section>
<div id="controls">
<label>状態 <select id="status"><option value="">すべて</option><option value="todo">未着手</option><option value="in_progress">進行中</option><option value="blocked">ブロック</option><option value="done">完了</option></select></label>
<label>マイルストーン <select id="milestone"><option value="">すべて</option></select></label>
<label>検索 <input id="query" type="search" placeholder="ID・タイトル・完了条件"></label>
</div>
<p id="count" aria-live="polite"></p><section id="tasks" aria-label="タスク一覧"></section>
</main>
<script src="tasks.js"></script>
<script src="app.js"></script>
</html>
