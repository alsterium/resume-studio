[package]
name = "resume-studio"
version = "0.1.0"
edition = "2021"
rust-version = "1.96.1"

[features]
real-tex = []
desktop-e2e = ["dep:tauri-plugin-wdio-webdriver"]

[[test]]
name = "real_tex"
required-features = ["real-tex"]

[lib]
name = "resume_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
tempfile = "=3.27.0"
libc = "=0.2.190"
tauri-plugin-wdio-webdriver = { version = "=1.4.0", optional = true }
serde_json = "=1.0.151"
jsonschema = { version = "=0.58.5", default-features = false }
url = "=2.5.8"
