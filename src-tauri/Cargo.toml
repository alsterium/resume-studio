[package]
name = "resume-studio"
version = "0.1.0"
edition = "2021"
rust-version = "1.96.1"

[lib]
name = "resume_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
tempfile = "=3.27.0"
libc = "=0.2.190"

[dev-dependencies]
serde_json = "=1.0.151"
